<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="50%" stop-color="#101016"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d4d4d8"/>
      <stop offset="70%" stop-color="#8e8e99"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#a1a1aa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.09"/>
    </pattern>
  </defs>

  <!-- Base Frame -->
  <rect width="1200" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="22" fill="url(#glow1)"/>
  <rect width="1200" height="380" rx="22" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="378" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- Top Telemetry Row -->
  <g transform="translate(56, 46)">
    <rect x="0" y="0" width="44" height="44" rx="11" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.28"/>
    <text x="22" y="28" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">AA</text>

    <text x="62" y="19" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3">PORTFOLIO &amp; SYSTEMS DOSSIER // WINNIPEG, MB (49.8951° N, 97.1384° W)</text>
    <text x="62" y="38" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600">GOVERNMENT OF MANITOBA · UNIVERSITY OF MANITOBA (ECONOMICS &amp; STATISTICS '27)</text>

    <rect x="920" y="6" width="168" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.24"/>
    <circle cx="940" cy="22" r="4.5" fill="#ffffff"/>
    <text x="954" y="26" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.5">NPN '26 NOMINEE</text>
  </g>

  <!-- Main Display Name & Tagline -->
  <g transform="translate(56, 162)">
    <text x="0" y="0" fill="url(#chrome)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">AMMAR AKHUND</text>
    <text x="0" y="44" fill="#e4e4e7" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="25">"I turn data into decisions &amp; my thoughts into actions."</text>
    <text x="0" y="82" fill="#a1a1aa" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16">Public Service (Dept. of Housing, Addictions &amp; Homelessness) · Econometrics &amp; ML Forecasting · Creator of Focus Arena 3D</text>
  </g>

  <!-- Bottom 4 Pillar Metric Pills -->
  <g transform="translate(56, 286)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(0, 0)">
      <rect width="255" height="52" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="18" y="22" fill="#a1a1aa" font-size="10" letter-spacing="1.5">01 // PUBLIC SERVICE</text>
      <text x="18" y="40" fill="#ffffff" font-size="13" font-weight="700">Government of Manitoba</text>
    </g>
    <g transform="translate(275, 0)">
      <rect width="255" height="52" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="18" y="22" fill="#a1a1aa" font-size="10" letter-spacing="1.5">02 // QUANTITATIVE DEGREE</text>
      <text x="18" y="40" fill="#ffffff" font-size="13" font-weight="700">B.A. Econ &amp; Stats · UofM '27</text>
    </g>
    <g transform="translate(550, 0)">
      <rect width="255" height="52" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="18" y="22" fill="#a1a1aa" font-size="10" letter-spacing="1.5">03 // LIVE AI WORKSPACE</text>
      <text x="18" y="40" fill="#ffffff" font-size="13" font-weight="700">Focus Arena (React + R3F)</text>
    </g>
    <g transform="translate(825, 0)">
      <rect width="263" height="52" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="18" y="22" fill="#a1a1aa" font-size="10" letter-spacing="1.5">04 // GLOBAL FLUENCY</text>
      <text x="18" y="40" fill="#ffffff" font-size="13" font-weight="700">8 Languages · 1,050+ Network</text>
    </g>
  </g>
</svg>
