<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b0f"/>
      <stop offset="50%" stop-color="#15151d"/>
      <stop offset="100%" stop-color="#09090c"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="230" rx="18" fill="url(#cardBg)"/>
  <rect x="1" y="1" width="1198" height="228" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>

  <!-- Left Emblem -->
  <g transform="translate(48, 42)">
    <rect width="146" height="146" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="73" y="56" text-anchor="middle" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2">MANITOBA</text>
    <text x="73" y="94" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800">NPN '26</text>
    <text x="73" y="122" text-anchor="middle" fill="#d4d4d8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">NOMINEE</text>
  </g>

  <!-- Right Copy -->
  <g transform="translate(226, 56)">
    <text x="0" y="0" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5">DISTINCTION // PUBLIC SERVICE &amp; ENTERPRISE OPERATIONS</text>
    <text x="0" y="38" fill="url(#silver)" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">2026 New Professionals Network — "A Future-Fit Public Service"</text>
    <text x="0" y="72" fill="#d4d4d8" font-family="system-ui, -apple-system, sans-serif" font-size="15.5">Nominated within the Department of Housing, Addictions &amp; Homelessness at the Government of Manitoba,</text>
    <text x="0" y="96" fill="#d4d4d8" font-family="system-ui, -apple-system, sans-serif" font-size="15.5">paired with 4+ years of high-volume SAP ERP &amp; client operations at Loblaw and 4 shipped AI/Data builds.</text>

    <g transform="translate(0, 116)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#ffffff">
      <rect x="0" y="0" width="210" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="105" y="18" text-anchor="middle">GOV OF MANITOBA · WPG</text>

      <rect x="224" y="0" width="230" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="339" y="18" text-anchor="middle">FORAGE · BofA / GS / KPMG</text>

      <rect x="468" y="0" width="230" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="583" y="18" text-anchor="middle">HEADSTARTER · HACKATHON '24</text>
    </g>
  </g>
</svg>
